<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar mision</title>
</head>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar misión</title>
</head>
<body>
    <h1>Editar misión</h1>
    <a href="/misiones">Volver a las misiones</a>

    <form action="{{ url_for('actualizar_mision', id=mision.id) }}" method="POST">

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre"value="{{ mision.nombre }}" required>
        <br>

        <label for="fecha">Fecha:</label>
        <input type="date" id="fecha" name="fecha"value="{{ mision.fecha.strftime('%Y-%m-%d') }}" min="{{now_date}}" required>
        <br>

        <label for="voluntario_necesario">Voluntarios necesarios:</label>
        <input type="number" id="voluntario_necesario"name="voluntario_necesario"value="{{ mision.voluntario_necesario }}"min="1" required>
        <br>

        <label for="descripcion">Descripción:</label>
        <textarea id="descripcion" name="descripcion"required>{{ mision.descripcion }}</textarea>
        <br>

        <input type="submit" value="Actualizar misión">

    </form>

    
</body>
</html>
